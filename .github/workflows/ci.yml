name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        name: ${{ matrix.task }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                task: [check, build]
        env:
            # Public build-time URL; CI does not need a running API or secrets.
            VITE_SERVER_URL: http://localhost:3000
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  package-manager-cache: false

            - name: Set up Bun
              id: bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Cache Bun dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run tests
              if: matrix.task == 'check'
              run: bun run test

            - name: Run ${{ matrix.task }}
              run: bun run ${{ matrix.task }}
